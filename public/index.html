<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gold GYM</title>
    <link rel="stylesheet" href="Styles/design-system.css">
    <link rel="stylesheet" href="Styles/base.css">
    <style>
      /* Estilos específicos para la página de login */
      .login-page-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
        box-sizing: border-box;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .login-card h2 {
        margin-bottom: 1.5rem;
        color: var(--text-primary);
      }
      .form-group {
        margin-bottom: 1.5rem;
        text-align: left;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-secondary);
        font-weight: 500;
      }
      .login-card .btn-accent {
        width: 100%;
      }
      #message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 8px;
        display: none; /* Oculto por defecto */
      }
      .error {
          background-color: #5c1a1a;
          color: #ffacac;
          border: 1px solid #a34747;
      }
      .success {
          background-color: #1a5c3a;
          color: #acffca;
          border: 1px solid #47a367;
      }
    </style>
</head>
<body data-theme="dark">

    <div class="login-page-wrapper">
        <div class="card login-card">
            <h2>Acceso al Gimnasio</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" class="input" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" class="input" required>
                </div>
                <button type="submit" class="btn-accent">Iniciar Sesión</button>
                <p id="message"></p>
            </form>
        </div>
    </div>

    <script src="Logic/index.js"></script>
</body>
</html>
